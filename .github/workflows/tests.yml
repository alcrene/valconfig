name: Run tests
run-name: ${{ github.actor }} is running the test suite

# Runs the test suite against every supported Python version.
# It can also be triggered manually: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow#running-a-workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  test:
    name: Python ${{ matrix.python-version }}, pydantic ${{ matrix.pydantic-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Let all versions finish, so we see every version that breaks
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pydantic-version: ["latest"]
        # Also test the oldest pydantic supported on each Python version (see pyproject.toml)
        include:
          - { os: ubuntu-latest, python-version: "3.11", pydantic-version: "2.6.0" }
          - { os: ubuntu-latest, python-version: "3.12", pydantic-version: "2.6.0" }
          - { os: ubuntu-latest, python-version: "3.13", pydantic-version: "2.8.0" }
          - { os: ubuntu-latest, python-version: "3.14", pydantic-version: "2.12.0" }
          - { os: ubuntu-latest, python-version: "3.15", pydantic-version: "2.13.0" }

    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools-scm needs tags to determine the version
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Allows testing the newest version before its final release
          allow-prereleases: true
          cache: pip

      - name: Install package with test dependencies
        run: >-
          python -m pip install ".[test]"
          ${{ matrix.pydantic-version != 'latest' && format('"pydantic=={0}"', matrix.pydantic-version) || '' }}

      - name: Run tests
        run: python -m pytest
