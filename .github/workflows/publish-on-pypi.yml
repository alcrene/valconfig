# https://docs.pypi.org/trusted-publishers/using-a-publisher/
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# https://github.com/marketplace/actions/pypi-publish#non-goals
# https://github.com/actions/download-artifact?tab=readme-ov-file#download-artifacts-from-other-workflow-runs-or-repositories

name: Publish release on PyPI
run-name: ${{ github.actor }} is publishing the latest release on PyPI
# Workflow runs when a new (non-pre-)release is created in the GitHub web UI.
# The `release` environment must allow deployments from `v*` tags, since release events run on the tag.
# It can also be triggered manually: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow#running-a-workflow
on:
  release:
    types: [released]
  workflow_dispatch:
jobs:


  build:
    uses: ./.github/workflows/build.yml


  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-build
          path: dist/

      - name: Display structure of downloaded files
        run: ls -R

      - name: Publish package distributions PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
